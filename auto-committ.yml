name: Auto Commit

on:
  # Choose one or more triggers:
  push:                    # after every push
  schedule:
    - cron: '0 0 * * *'    # every day at midnight UTC
  workflow_dispatch:       # allow manual run from Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push commits

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make changes (example)
        run: |
          # Example: update a file
          echo "Last updated: $(date)" >> auto-update.txt
          # Add your real commands here (build, generate files, etc.)

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update $(date +'%Y-%m-%d %H:%M')"
          git push