<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ========== META & TITLE ========== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deseret One — Learn, Read, Write & Translate the Deseret Alphabet</title>
  <link rel="icon" href="https://i.ibb.co/cpzyw3c/image.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/cpzyw3c/image.png">
  <meta name="description" content="Deseret One is a guide to learning, reading, writing, and translating the Deseret Alphabet, with lessons, historical texts, and a growing digital library.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://deseret.one/">

  <!-- ========== GOOGLE FONTS ========== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- ========== STYLES ========== -->
  <style>
    /* ===== ROOT VARIABLES ===== */
    @font-face {
      font-family: "Noto Sans Deseret";
      src: url("https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/unhinted/otf/NotoSansDeseret/NotoSansDeseret-Regular.otf") format("opentype");
      font-display: swap;
      unicode-range: U+10400-1044F;
    }

    :root{--brand:#01C5FB;--brand-deep:#01B4E8;--brand-ink:#00303D;--blue:#017898;--blue-deep:#00607A;--ink:#000;--line:#c9d1dd;--bg:#fff;--sans:'Open Sans','Calibri',Arial,sans-serif;--serif:'Libre Baskerville','Georgia',serif;--fs:1rem;--fs-body:1rem}

    /* ===== RESET & BASE ===== */
    *{box-sizing:border-box}
    html,body{margin:0}
    body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:var(--fs-body);line-height:1.7;-webkit-font-smoothing:antialiased}
    .de{font-family:"Noto Sans Deseret","Segoe UI Symbol","Apple Symbols","DejaVu Sans",serif}
    a{color:var(--ink)}
