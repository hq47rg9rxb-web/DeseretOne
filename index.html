<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deseret One</title>
  <meta name="description" content="Deseret Unicode converter and study page.">
  <style>
    @font-face {
      font-family: "Noto Sans Deseret";
      src: url("https://cdn.jsdelivr.net/gh/googlefonts/noto-fonts@main/unhinted/otf/NotoSansDeseret/NotoSansDeseret-Regular.otf") format("opentype");
      font-display: swap;
      unicode-range: U+10400-1044F;
    }

    :root {
      --bg: #f5fbff;
      --panel: #ffffff;
      --ink: #0d1b22;
      --muted: #425a68;
      --line: #dfeaf1;
      --brand: #01c5fb;
      --brand-deep: #017898;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .wrap {
      width: min(900px, calc(100% - 28px));
      margin: 40px auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(1, 117, 146, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #00303d;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .de {
      font-family: "Noto Sans Deseret", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", serif;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      font-weight: 700;
      color: #123646;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      resize: vertical;
      color: var(--ink);
      background: #f9fdff;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--brand), var(--brand-deep));
      color: white;
      font-weight: 700;
      padding: 0.8rem 1.3rem;
      cursor: pointer;
    }

    .secondary {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .output {
      min-height: 150px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f9fdff;
      font-size: 1.4rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Deseret One</h1>
      <p>Type English and convert it to Deseret Unicode.</p>

      <label for="english">English</label>
      <textarea id="english" placeholder="Type text here...">hello world</textarea>

      <div class="row">
        <button id="convert">Convert to Deseret</button>
        <button id="clear" class="secondary" type="button">Clear</button>
      </div>

      <label for="deseretOutput">Deseret</label>
      <div id="deseretOutput" class="output de" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const map = {
      a: '𐐀', b: '𐐫', c: '𐐝', d: '𐐔', e: '𐐁', f: '𐐢', g: '𐐘', h: '𐐐',
      i: '𐐂', j: '𐐖', k: '𐐗', l: '𐐍', m: '𐐣', n: '𐐤', o: '𐐃', p: '𐐡',
      q: '𐐥', r: '𐐬', s: '𐐠', t: '𐐻', u: '𐐄', v: '𐐳', w: '𐐶', x: '𐐨',
      y: '𐐲', z: '𐐮'
    };

    const english = document.getElementById('english');
    const output = document.getElementById('deseretOutput');
    const convertBtn = document.getElementById('convert');
    const clearBtn = document.getElementById('clear');

    function toDeseret(text) {
      return Array.from(text).map(ch => {
        const lower = ch.toLowerCase();
        if (map[lower]) {
          return /[A-Z]/.test(ch) ? map[lower].toUpperCase() : map[lower];
        }
        return ch;
      }).join('');
    }

    function render() {
      output.textContent = toDeseret(english.value || '');
    }

    convertBtn.addEventListener('click', render);
    english.addEventListener('input', render);
    clearBtn.addEventListener('click', () => {
      english.value = '';
      output.textContent = '';
      english.focus();
    });

    render();
  </script>
</body>
</html>
